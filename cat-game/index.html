<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #f0f8ff;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .game-object {
            position: absolute;
            cursor: pointer;
            transition: transform 0.1s;
            transform-origin: center;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
        }

        .game-object:hover {
            transform: scale(1.1);
        }

        .mouse {
            width: 70px;
            height: 70px;
            background-image: url("./rat.png");
            will-change: transform;
        }

        .bird {
            width: 80px;
            height: 80px;
            background-image: url("./bird.png");
            will-change: transform;
        }

        #score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 100;
        }

        #timer-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 100;
        }

        #start-screen, #settings-screen, #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(240, 248, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .title {
            font-size: 72px;
            color: #333;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 40px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 24px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.3s;
            width: 200px;
        }

        .button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .settings-group {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
            width: 80%;
            max-width: 500px;
        }

        .settings-group h2 {
            margin-top: 0;
            color: #333;
        }

        .settings-option {
            margin: 15px 0;
        }

        label {
            font-size: 18px;
            margin-right: 10px;
        }

        select, input {
            font-size: 16px;
            padding: 5px;
        }

        .radio-group {
            display: flex;
            justify-content: space-between;
            max-width: 300px;
            margin: 0 auto;
        }

        .radio-option {
            display: flex;
            align-items: center;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            z-index: 150;
            display: none;
        }

        #game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #333;
        }

        #final-score {
            font-size: 48px;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        #pause-screen {
            display: none;
        }
        
        .pause-title {
            font-size: 48px;
            color: #333;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time: 0</div>
        
        <div id="game-over">
            <h2>Game Over!</h2>
            <div>Your score:</div>
            <div id="final-score">0</div>
            <button class="button" onclick="showStartScreen()">Play Again</button>
        </div>

        <div id="start-screen">
            <h1 class="title">Cat Game</h1>
            <button class="button" onclick="startGame()">PLAY</button>
            <button class="button" onclick="showSettings()">SETTINGS</button>
        </div>

        <div id="settings-screen" style="display: none;">
            <h1 class="title">Settings</h1>
            
            <div class="settings-group">
                <h2>Game Object</h2>
                <div class="settings-option">
                    <label for="object-select">Choose object:</label>
                    <select id="object-select">
                        <option value="mouse">Mouse</option>
                        <option value="bird">Bird</option>
                    </select>
                </div>
            </div>
            
            <div class="settings-group">
                <h2>Object Speed</h2>
                <div class="settings-option">
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="speed-slow" name="speed" value="slow" checked>
                            <label for="speed-slow">Slow</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="speed-medium" name="speed" value="medium">
                            <label for="speed-medium">Medium</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="speed-fast" name="speed" value="fast">
                            <label for="speed-fast">Fast</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="settings-group">
                <h2>Game Time</h2>
                <div class="settings-option">
                    <label for="time-select">Game duration:</label>
                    <select id="time-select">
                        <option value="15">15 seconds</option>
                        <option value="30" selected>30 seconds</option>
                        <option value="60">60 seconds</option>
                        <option value="0">Infinity</option>
                    </select>
                </div>
            </div>
            
            <button class="button" onclick="saveSettings()">SAVE</button>
        </div>

        <div id="pause-screen">
            <h1 class="pause-title">Game Paused</h1>
            <button class="button" onclick="resumeGame()">RESUME</button>
            <button class="button" onclick="restartGame()">RESTART</button>
            <button class="button" onclick="showPauseSettings()">SETTINGS</button>
            <button class="button" onclick="quitToMainMenu()">QUIT</button>
        </div>
    </div>

    <script>
        let score = 0;
        let gameTime = 30; // Default time in seconds
        let timerInterval;
        let currentTime = 0;
        let gameActive = false;
        let gamePaused = false;
        let objectType = 'mouse'; // Default object
        let objectSpeed = 'slow'; // Default speed
        let speedValues = {
            slow: 2000,
            medium: 1200,
            fast: 800
        };
        let movementSpeed = speedValues.slow;
        let objects = [];
        let maxObjects = 5;
        let previousSettings = {};
        
        // Movement variables
        const maxTurnAngle = Math.PI / 6; // Max turning angle (30 degrees)
        const minStepSize = 0.5;          // Minimum movement per frame
        const maxStepSize = 2.5;          // Maximum movement per frame

        // DOM references
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const startScreen = document.getElementById('start-screen');
        const settingsScreen = document.getElementById('settings-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        // Add event listener for the ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && gameActive) {
                togglePause();
            }
        });

        function togglePause() {
            if (gamePaused) {
                resumeGame();
            } else {
                pauseGame();
            }
        }

        function pauseGame() {
            if (!gameActive || gamePaused) return;
            
            gamePaused = true;
            clearInterval(timerInterval);
            pauseScreen.style.display = 'flex';
        }

        function resumeGame() {
            if (!gameActive || !gamePaused) return;
            
            gamePaused = false;
            pauseScreen.style.display = 'none';
            
            if (gameTime > 0) {
                timerInterval = setInterval(updateTimer, 1000);
            }
        }

        function restartGame() {
            pauseScreen.style.display = 'none';
            resetGame();
            startGame();
        }

        function showPauseSettings() {
            // Store current settings before showing settings screen
            previousSettings = {
                objectType: objectType,
                objectSpeed: objectSpeed,
                gameTime: gameTime
            };
            
            pauseScreen.style.display = 'none';
            settingsScreen.style.display = 'flex';
            
            document.getElementById('object-select').value = objectType;
            
            const speedRadios = document.getElementsByName('speed');
            for (const radio of speedRadios) {
                if (radio.value === objectSpeed) {
                    radio.checked = true;
                    break;
                }
            }
            
            document.getElementById('time-select').value = gameTime.toString();
        }

        function quitToMainMenu() {
            pauseScreen.style.display = 'none';
            resetGame();
            showStartScreen();
        }

        function showStartScreen() {
            resetGame();
            startScreen.style.display = 'flex';
            settingsScreen.style.display = 'none';
            pauseScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }

        function showSettings() {
            previousSettings = {
                objectType: objectType,
                objectSpeed: objectSpeed,
                gameTime: gameTime
            };
            
            startScreen.style.display = 'none';
            settingsScreen.style.display = 'flex';
        }

        function saveSettings() {
            const newObjectType = document.getElementById('object-select').value;
            
            let newObjectSpeed;
            const speedRadios = document.getElementsByName('speed');
            for (const radio of speedRadios) {
                if (radio.checked) {
                    newObjectSpeed = radio.value;
                    break;
                }
            }
            
            const newGameTime = parseInt(document.getElementById('time-select').value);
            
            objectType = newObjectType;
            objectSpeed = newObjectSpeed;
            movementSpeed = speedValues[objectSpeed];
            gameTime = newGameTime;
            
            if (gameActive && gamePaused && 
                (previousSettings.objectType !== objectType || 
                previousSettings.objectSpeed !== objectSpeed || 
                previousSettings.gameTime !== gameTime)) {
                settingsScreen.style.display = 'none';
                resetGame();
                startGame();
            } else if (gameActive && gamePaused) {
                settingsScreen.style.display = 'none';
                pauseScreen.style.display = 'flex';
            } else {
                showStartScreen();
            }
        }

        function startGame() {
            resetGame();
            startScreen.style.display = 'none';
            gameActive = true;
            gamePaused = false;
            
            if (gameTime > 0) {
                timerInterval = setInterval(updateTimer, 1000);
            } else {
                timerDisplay.textContent = 'Time: ∞';
            }
            
            for (let i = 0; i < 3; i++) {
                createObject();
            }
            
            setInterval(() => {
                if (gameActive && !gamePaused && objects.length < maxObjects) {
                    createObject();
                }
            }, 2000);
        }

        function resetGame() {
            score = 0;
            currentTime = 0;
            gameActive = false;
            gamePaused = false;
            objects.forEach(obj => obj.element.remove());
            objects = [];
            
            clearInterval(timerInterval);
            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Time: ${currentTime}`;
        }

        function updateTimer() {
            currentTime++;
            timerDisplay.textContent = `Time: ${currentTime}`;
            
            if (gameTime > 0 && currentTime >= gameTime) {
                endGame();
            }
        }

        function endGame() {
            gameActive = false;
            gamePaused = false;
            clearInterval(timerInterval);
            gameOverScreen.style.display = 'block';
            finalScoreDisplay.textContent = score;
            
            objects.forEach(obj => {
                obj.element.style.transition = 'opacity 0.5s';
                obj.element.style.opacity = 0;
                setTimeout(() => obj.element.remove(), 500);
            });
            objects = [];
        }

        function createObject() {
            if (!gameActive || gamePaused) return;
            
            const objectElement = document.createElement('div');
            objectElement.className = `game-object ${objectType}`;
            
            const objWidth = objectType === 'mouse' ? 70 : 80;
            const objHeight = objectType === 'mouse' ? 70 : 80;
            const posX = Math.random() * (window.innerWidth - objWidth);
            const posY = Math.random() * (window.innerHeight - objHeight);
            
            objectElement.style.left = `${posX}px`;
            objectElement.style.top = `${posY}px`;
            objectElement.style.width = `${objWidth}px`;
            objectElement.style.height = `${objHeight}px`;
            
            // Set initial rotation based on angle
            const angle = Math.random() * Math.PI * 2;
            const rotationDegrees = (angle * 180 / Math.PI) + 90;
            objectElement.style.transform = `rotate(${rotationDegrees}deg)`;
            
            gameContainer.appendChild(objectElement);
            
            const object = {
                element: objectElement,
                x: posX,
                y: posY,
                width: objWidth,
                height: objHeight,
                angle: angle,
                speed: getRandomSpeed(),
                lastTurnTime: Date.now(),
                turnInterval: getRandomTurnInterval()
            };
            
            objects.push(object);
            
            objectElement.addEventListener('click', () => {
                if (!gameActive || gamePaused) return;
                
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                
                const index = objects.findIndex(obj => obj.element === objectElement);
                if (index !== -1) {
                    objects.splice(index, 1);
                }
                
                objectElement.style.transition = 'transform 0.2s, opacity 0.2s';
                objectElement.style.transform = 'scale(0.1)';
                objectElement.style.opacity = 0;
                setTimeout(() => objectElement.remove(), 200);
                
                setTimeout(() => {
                    if (gameActive && !gamePaused) {
                        createObject();
                    }
                }, 1000);
            });
            
            moveObject(object);
        }

        function getRandomSpeed() {
            let baseSpeed;
            switch (objectSpeed) {
                case 'slow':
                    baseSpeed = 0.8;
                    break;
                case 'medium':
                    baseSpeed = 1.5;
                    break;
                case 'fast':
                    baseSpeed = 2.2;
                    break;
                default:
                    baseSpeed = 1.0;
            }
            
            return baseSpeed + Math.random() * 0.5;
        }

        function getRandomTurnInterval() {
            return 500 + Math.random() * 1500; // Between 0.5 and 2 seconds
        }

        function moveObject(object) {
            if (!gameActive || !object.element) return;
            if (gamePaused) {
                requestAnimationFrame(() => moveObject(object));
                return;
            }
            
            const now = Date.now();
            
            if (now - object.lastTurnTime > object.turnInterval) {
                // Random turn angle (within maxTurnAngle)
                const turnAmount = (Math.random() * 2 - 1) * maxTurnAngle;
                object.angle += turnAmount;
                object.lastTurnTime = now;
                object.turnInterval = getRandomTurnInterval();
            }
            
            const dx = Math.cos(object.angle) * object.speed;
            const dy = Math.sin(object.angle) * object.speed;
            
            object.x += dx;
            object.y += dy;
            
            const margin = 20;
            if (object.x < margin) {
                object.x = margin;
                object.angle = Math.PI - object.angle;
                object.lastTurnTime = now;
            } else if (object.x > window.innerWidth - object.width - margin) {
                object.x = window.innerWidth - object.width - margin;
                object.angle = Math.PI - object.angle;
                object.lastTurnTime = now;
            }
            
            if (object.y < margin) {
                object.y = margin;
                object.angle = -object.angle;
                object.lastTurnTime = now;
            } else if (object.y > window.innerHeight - object.height - margin) {
                object.y = window.innerHeight - object.height - margin;
                object.angle = -object.angle;
                object.lastTurnTime = now;
            }
            
            object.element.style.left = `${object.x}px`;
            object.element.style.top = `${object.y}px`;
            
            const rotationDegrees = (object.angle * 180 / Math.PI) + 90;
            object.element.style.transform = `rotate(${rotationDegrees}deg)`;
            
            object.element.onmouseover = () => {
                object.element.style.transform = `rotate(${rotationDegrees}deg) scale(1.1)`;
            };
            
            object.element.onmouseout = () => {
                object.element.style.transform = `rotate(${rotationDegrees}deg)`;
            };
            
            requestAnimationFrame(() => moveObject(object));
        }

        function getRandomPosition(max) {
            return Math.random() * max;
        }

        showStartScreen();

        // Handle window resize
        window.addEventListener('resize', () => {
            objects.forEach(obj => {
                // Make sure objects are within the window
                if (obj.x > window.innerWidth - obj.width) {
                    obj.x = window.innerWidth - obj.width;
                    obj.element.style.left = `${obj.x}px`;
                }
                if (obj.y > window.innerHeight - obj.height) {
                    obj.y = window.innerHeight - obj.height;
                    obj.element.style.top = `${obj.y}px`;
                }
                
                // Update targets if needed
                if (obj.targetX > window.innerWidth - obj.width) {
                    obj.targetX = window.innerWidth - obj.width;
                }
                if (obj.targetY > window.innerHeight - obj.height) {
                    obj.targetY = window.innerHeight - obj.height;
                }
            });
        });
    </script>
</body>
</html>
